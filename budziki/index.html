<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budziki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Budziki: /api/alarmy (portal); dzwoni i czyta poranny przegląd bot (petla_budzikow). */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16202C; --muted:#56606E; --line:#D5DBE3; --soft:#E4E9F0;
  --nav:#1F3A5F; --navInk:#FFFFFF; --sel:#1d63c4; --ok:#1f8a4c; --warn:#a86b00; --bad:#c03442;
  --serif:"Alegreya",Georgia,serif; --sans:"Alegreya Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
    --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
  --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
h1,h2{font-family:var(--serif);line-height:1.15;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--nav);color:var(--navInk);padding:14px 0 18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header.top .back{display:inline-block;font-size:14px;opacity:.75;text-decoration:none;color:inherit;margin-bottom:8px}
header.top h1{font-size:clamp(30px,7vw,42px);font-weight:800}
header.top p{margin:4px 0 0;opacity:.8;font-size:15px}
main{padding:18px 0 60px}
.siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.karta,div.karta{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:inherit;text-decoration:none}
a.karta:hover{border-color:var(--sel)}
.karta h2{font-size:23px;display:flex;gap:8px;align-items:center}
.karta .opis{color:var(--muted);font-size:15px;margin:4px 0 10px}
.karta .stan{font-weight:700;font-size:15px}
.karta .stan .uw{color:var(--bad)} .karta .stan .dzis{color:var(--warn)}
.karta.wkrotce{opacity:.65;border-style:dashed}
.znaczek{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:auto;font-family:var(--sans)}
ul{margin:0;padding-left:18px;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:22px;margin-bottom:8px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 160px;min-width:0;height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit}
button{height:44px;border:1.5px solid var(--sel);background:var(--sel);color:#fff;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}
button.jasny{background:var(--surface);color:inherit;border-color:var(--line)}
pre{white-space:pre-wrap;font-family:var(--sans);font-size:16px;margin:10px 0 0;line-height:1.55}
.muted{color:var(--muted);font-size:14px}
.szybkie{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.al{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.al:first-child{border-top:0}
.al .g{font-size:26px;font-weight:800;font-family:var(--serif)}
.al.off .g,.al.off .k{opacity:.45}
.al .k{color:var(--muted);font-size:15px}
.przyc{display:flex;gap:6px}
.przyc button,.jasny{background:var(--surface);color:inherit;border:1.5px solid var(--line);border-radius:10px;height:40px;padding:0 12px;font:inherit;font-weight:700;cursor:pointer}
.dni{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dni label{border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;font-weight:700;font-size:15px}
.dni input{display:none}
.dni[hidden]{display:none}
.rodzaj label{display:flex;gap:6px;align-items:center}
.rodzaj input{flex:none;width:auto;height:auto;margin:0}
.dni label:has(input:checked){background:var(--sel);color:#fff;border-color:var(--sel)}
.rodzaj{display:flex;gap:14px;margin-top:8px;font-size:16px}
.przelacz{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0}
.przelacz::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.przelacz.on{background:var(--ok)} .przelacz.on::after{left:25px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="/strony/automatyczne/">← Automatyczne</a>
  <h1>⏰ Budziki</h1>
  <p>Pi dzwoni o tej porze przez Linphone i czyta poranny przegląd: lekcje i zmiany planu, sprawdziany, maile, zadania, serwer.</p>
</div></header>
<main><div class="wrap">
  <div class="card"><h2>⏰ Budziki</h2><div id="lista"><p class="muted">…</p></div></div>
  <div class="card"><h2>Nowy budzik</h2>
    <form id="f">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="time" id="godz" required value="06:30" style="flex:0 0 130px"><input id="opis" placeholder="Opis (opcjonalnie)" maxlength="100"></div>
      <div class="rodzaj"><label><input type="radio" name="r" value="raz" checked> jednorazowo</label><label><input type="radio" name="r" value="powt"> powtarzany</label></div>
      <div id="rRaz" style="margin-top:8px"><input type="date" id="data"></div>
      <div id="rPowt" class="dni" hidden></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button>Dodaj</button><span id="info" class="muted"></span></div>
    </form>
    <p class="muted" style="margin:10px 0 0">Albo słowami w Linphone, Telegramie lub przez telefon: „budzik jutro 6:15”, „budzik w dni robocze 6:30”.</p></div>
<div data-ustawienia="budziki"></div>
</div></main>
<script>
const $ = id => document.getElementById(id);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for(const [n, v] of Object.entries(a)){ if(v == null) continue; if(n === "text") e.textContent = v; else if(n === "class") e.className = v; else if(n.startsWith("on")) e[n] = v; else e.setAttribute(n, v); } e.append(...k.filter(x => x != null)); return e; };
const DNI = ["poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota", "niedziela"];
const dataPl = iso => { const d = new Date(iso + "T00:00"); return `${DNI[(d.getDay() + 6) % 7]} ${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}`; };
const SKR = ["pon", "wt", "śr", "czw", "pt", "sob", "niedz"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const api = async (url, body) => { const r = await fetch(url, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); };
$("rPowt").append(...SKR.map((s, i) => el("label", {}, el("input", {type:"checkbox", value:String(i), ...(i < 5 ? {checked:""} : {})}), s)));
document.querySelectorAll("input[name=r]").forEach(r => r.onchange = () => { const p = document.querySelector("input[name=r]:checked").value === "powt"; $("rPowt").hidden = !p; $("rRaz").hidden = p; });
function kiedy(a){
  if(a.data) return dataPl(a.data);
  const d = [...a.dni].sort();
  return d.length === 7 ? "codziennie" : d.join() === "0,1,2,3,4" ? "w dni robocze" : d.join() === "5,6" ? "w weekendy" : d.map(x => SKR[x]).join(", ");
}
async function lista(){
  const l = (await api("/api/alarmy")).alarmy.filter(a => a.aktywny || !a.data).sort((a, b) => a.godzina.localeCompare(b.godzina));
  $("lista").replaceChildren(...(l.length ? l.map(a => el("div", {class:"al" + (a.aktywny ? "" : " off")},
    el("div", {}, el("div", {class:"g", text:a.godzina}), el("div", {class:"k", text:kiedy(a) + (a.opis ? " · " + a.opis : "")})),
    el("div", {class:"przyc"},
      el("button", {type:"button", class:"przelacz" + (a.aktywny ? " on" : ""), title:a.aktywny ? "Wyłącz" : "Włącz", "aria-label":a.aktywny ? "Wyłącz" : "Włącz",
        onclick:async () => { await api(`/api/alarmy/${a.id}`, {aktywny:!a.aktywny}); lista(); }}),
      el("button", {type:"button", title:"Usuń", "aria-label":"Usuń", text:"🗑", onclick:async () => { if(confirm(`Usunąć budzik ${a.godzina}?`)){ await api(`/api/alarmy/${a.id}`, {usun:true}); lista(); } }}))))
    : [el("p", {class:"muted", text:"Brak budzików."})]));
}
$("f").onsubmit = async e => {
  e.preventDefault();
  const g = $("godz").value, powt = document.querySelector("input[name=r]:checked").value === "powt";
  let body = {godzina:g, opis:$("opis").value.trim()};
  if(powt){ const d = [...$("rPowt").querySelectorAll("input:checked")].map(x => +x.value); if(!d.length){ $("info").textContent = "Wybierz dni."; return; } body.dni = d; }
  else{ let d = $("data").value; if(!d){ const t = new Date(); const [h, m] = g.split(":").map(Number); if(h * 60 + m <= t.getHours() * 60 + t.getMinutes()) t.setDate(t.getDate() + 1); d = iso(t); } body.data = d; }
  try{ await api("/api/alarmy", body); $("info").textContent = "Dodany."; $("f").reset(); $("godz").value = "06:30"; $("rPowt").hidden = true; $("rRaz").hidden = false; lista(); }
  catch(err){ $("info").textContent = "Nie udało się dodać."; }
};
lista();
</script>
<script src="/strony/wspolne/ustawienia.js" defer></script>
</body>
</html>
