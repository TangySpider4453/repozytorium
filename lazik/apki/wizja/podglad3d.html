<!doctype html>
<html lang="pl" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Łazik: skan 3D</title>
<style>
  :root { --tlo:#0d1114; --panel:rgba(14,19,23,.82); --tekst:#e6ebee; --szary:#8b979f; --akcent:#e0a640; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--tlo); color:var(--tekst);
    font:15px/1.4 "Segoe UI", system-ui, sans-serif; touch-action:none; user-select:none; }
  canvas { display:block; }
  .hud { position:fixed; left:12px; top:12px; background:var(--panel); border-radius:10px; padding:10px 14px; max-width:min(420px, 70vw); }
  .hud b { font-size:17px; }
  .hud .maly { color:var(--szary); font-size:13px; }
  .pomoc { position:fixed; left:12px; bottom:12px; background:var(--panel); border-radius:10px; padding:8px 12px;
    font-size:13px; color:var(--szary); max-width:60vw; }
  .przyciski { position:fixed; right:12px; top:12px; display:flex; gap:8px; }
  button { background:#2a333a; color:var(--tekst); border:0; border-radius:10px; height:46px; min-width:46px; padding:0 12px;
    font:600 15px system-ui, sans-serif; cursor:pointer; }
  button:active, button.wl { background:var(--akcent); color:#111; }
  .joy { position:fixed; left:30px; bottom:70px; width:130px; height:130px; border-radius:50%;
    border:2px solid rgba(255,255,255,.25); display:none; }
  .joy i { position:absolute; left:45px; top:45px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.35); }
  @media (pointer:coarse) { .joy { display:block; } .pomoc .mysz { display:none; } }
  @media (pointer:fine) { .pomoc .dotyk { display:none; } }
</style>
</head>
<body>
<div class="hud" id="hud"></div>
<div class="przyciski">
  <button id="gora" title="Widok z góry">Z góry</button>
  <button id="mniej" title="Mniejsze punkty">−</button>
  <button id="wiecej" title="Większe punkty">+</button>
  <button id="start" title="Wróć na miejsce skanu">Start</button>
  <button id="zamknij" title="Zamknij">✕</button>
</div>
<div class="pomoc">
  <span class="mysz">Przeciągnij myszą: rozglądanie · W A S D / strzałki: chodzenie · Q / E: góra / dół · Shift: szybciej · kółko: do przodu</span>
  <span class="dotyk">Lewy dolny krąg: chodzenie · przeciągnij palcem po prawej stronie: rozglądanie</span>
</div>
<div class="joy" id="joy"><i></i></div>
<script src="three.min.js"></script>
<script>
if (!window.THREE) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
</script>
<script>
const DANE = /*__DANE__*/null;
(function () {
  if (!window.THREE || !DANE) {
    document.getElementById('hud').textContent = !DANE ? 'Brak danych skanu.' : 'Nie wczytano three.js (brak pliku three.min.js i internetu).';
    return;
  }
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const pos = new Float32Array(b64(DANE.pos).buffer);
  const kolB = b64(DANE.kol);
  const kol = new Float32Array(kolB.length);
  for (let i = 0; i < kolB.length; i++) kol[i] = kolB[i] / 255;

  const scena = new THREE.Scene();
  scena.background = new THREE.Color(0x0d1114);
  const kamera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 200);
  const render = new THREE.WebGLRenderer({ antialias: true });
  render.setPixelRatio(Math.min(devicePixelRatio, 2));
  render.setSize(innerWidth, innerHeight);
  document.body.prepend(render.domElement);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(kol, 3));
  const mat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, sizeAttenuation: true });
  scena.add(new THREE.Points(geo, mat));

  // podłoga pod najniższymi punktami i znacznik miejsca skanu
  const ys = Array.from({ length: Math.min(pos.length / 3, 20000) }, (_, i) => pos[Math.floor(i * pos.length / 3 / Math.min(pos.length / 3, 20000)) * 3 + 1]).sort((a, b) => a - b);
  const podloga = ys.length ? ys[Math.floor(ys.length * 0.03)] : -1.2;
  const siatka = new THREE.GridHelper(20, 40, 0x3a4a55, 0x222b31);
  siatka.position.y = podloga;
  scena.add(siatka);
  // znacznik miejsca skanu: pierścień na podłodze pod punktem startu
  const znacznik = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.18, 32), new THREE.MeshBasicMaterial({ color: 0xe0a640, side: THREE.DoubleSide }));
  znacznik.rotation.x = -Math.PI / 2;
  znacznik.position.y = podloga + 0.01;
  scena.add(znacznik);

  let odchyl = 0, pochyl = 0, zGory = false;
  const start = () => { kamera.position.set(0, 0, 0); odchyl = 0; pochyl = -0.05; };
  start();

  const hud = document.getElementById('hud');
  hud.innerHTML = `<b>${DANE.nazwa}</b><br>${DANE.punkty.toLocaleString('pl-PL')} punktów · obrót ${DANE.obrot_stopnie}°` +
    (DANE.opis ? `<br>${DANE.opis.replace(/\n/g, '<br>')}` : '') + `<div class="maly">${DANE.uwaga}</div>`;

  const klawisze = {};
  addEventListener('keydown', e => { klawisze[e.code] = true; if (e.code === 'Escape') zamknij(); });
  addEventListener('keyup', e => { klawisze[e.code] = false; });

  // rozglądanie myszą lub palcem (prawa część ekranu), chodzenie joystickiem (lewy dolny krąg)
  let patrz = null, joy = null, ruchJoy = { x: 0, y: 0 };
  const joyEl = document.getElementById('joy'), galka = joyEl.querySelector('i');
  const wJoy = (x, y) => { const r = joyEl.getBoundingClientRect(); return Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)) < r.width; };
  render.domElement.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' && getComputedStyle(joyEl).display !== 'none' && wJoy(e.clientX, e.clientY)) {
      joy = { id: e.pointerId };
    } else patrz = { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  addEventListener('pointermove', e => {
    if (patrz && e.pointerId === patrz.id) {
      odchyl -= (e.clientX - patrz.x) * 0.004; pochyl -= (e.clientY - patrz.y) * 0.004;
      pochyl = Math.max(-1.5, Math.min(1.5, pochyl)); patrz.x = e.clientX; patrz.y = e.clientY;
    }
    if (joy && e.pointerId === joy.id) {
      const r = joyEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), m = r.width / 2;
      if (d > m) { dx *= m / d; dy *= m / d; }
      ruchJoy = { x: dx / m, y: dy / m }; galka.style.transform = `translate(${dx}px,${dy}px)`;
    }
  });
  const pusc = e => {
    if (patrz && e.pointerId === patrz.id) patrz = null;
    if (joy && e.pointerId === joy.id) { joy = null; ruchJoy = { x: 0, y: 0 }; galka.style.transform = ''; }
  };
  addEventListener('pointerup', pusc); addEventListener('pointercancel', pusc);
  render.domElement.addEventListener('wheel', e => { e.preventDefault(); idz(0, -Math.sign(e.deltaY) * 0.3, 0); }, { passive: false });

  function idz(bok, przod, gora) {
    const kier = new THREE.Vector3(-Math.sin(odchyl), 0, -Math.cos(odchyl));
    const prawo = new THREE.Vector3(Math.cos(odchyl), 0, -Math.sin(odchyl));
    kamera.position.addScaledVector(kier, przod).addScaledVector(prawo, bok);
    kamera.position.y += gora;
  }

  const btnGora = document.getElementById('gora');
  btnGora.onclick = () => { zGory = !zGory; btnGora.classList.toggle('wl', zGory); };
  document.getElementById('mniej').onclick = () => { mat.size = Math.max(0.01, mat.size / 1.3); };
  document.getElementById('wiecej').onclick = () => { mat.size = Math.min(0.4, mat.size * 1.3); };
  document.getElementById('start').onclick = () => { zGory = false; btnGora.classList.remove('wl'); start(); };
  function zamknij() { if (history.length > 1) history.back(); else window.close(); }
  document.getElementById('zamknij').onclick = zamknij;
  addEventListener('resize', () => { kamera.aspect = innerWidth / innerHeight; kamera.updateProjectionMatrix(); render.setSize(innerWidth, innerHeight); });

  let poprz = performance.now();
  (function klatka(t) {
    const dt = Math.min(0.05, (t - poprz) / 1000); poprz = t;
    const v = (klawisze.ShiftLeft || klawisze.ShiftRight ? 4 : 1.4) * dt;
    let przod = 0, bok = 0, gora = 0;
    if (klawisze.KeyW || klawisze.ArrowUp) przod += v;
    if (klawisze.KeyS || klawisze.ArrowDown) przod -= v;
    if (klawisze.KeyA || klawisze.ArrowLeft) bok -= v;
    if (klawisze.KeyD || klawisze.ArrowRight) bok += v;
    if (klawisze.KeyE || klawisze.Space) gora += v;
    if (klawisze.KeyQ || klawisze.KeyC) gora -= v;
    przod -= ruchJoy.y * 1.4 * dt; bok += ruchJoy.x * 1.4 * dt;
    idz(bok, przod, gora);
    if (zGory) {
      kamera.position.y = Math.max(kamera.position.y, 6);
      kamera.rotation.set(-Math.PI / 2, odchyl, 0, 'YXZ');
    } else {
      kamera.rotation.set(pochyl, odchyl, 0, 'YXZ');
    }
    render.render(scena, kamera);
    requestAnimationFrame(klatka);
  })(poprz);
})();
</script>
</body>
</html>
