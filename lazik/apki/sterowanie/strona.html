<!doctype html>
<html lang="pl" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Łazik: sterowanie</title>
<style>
  :root { --tlo:#0d1114; --panel:#161c21; --panel2:#1f272d; --tekst:#e6ebee; --szary:#8b979f; --linia:#2a333a;
          --akcent:#e0a640; --ok:#3fbf6a; --zle:#e5534b; }
  * { box-sizing:border-box; }
  html { font-size:clamp(14px, 0.55vw + 10px, 19px); }  /* czcionka rośnie z ekranem: telefon 14 px … monitor 4K 19 px */
  html, body { margin:0; background:var(--tlo); color:var(--tekst); font:1rem/1.4 system-ui, "Segoe UI", sans-serif; }
  body { padding:calc(34px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right)) 10px max(10px, env(safe-area-inset-left)); }  /* 34 px na uchwyt panelu stanu */
  header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  header h1 { font-size:1.3rem; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:420px) { header h1 { font-size:1.05rem; } .lacze span { display:none; } }
  .lacze { font-size:13px; color:var(--szary); display:flex; align-items:center; gap:6px; }
  .lacze i { width:9px; height:9px; border-radius:50%; background:var(--zle); }
  .lacze.ok i { background:var(--ok); }
  button { font:600 1rem system-ui, sans-serif; color:var(--tekst); background:var(--panel2); border:0; border-radius:10px;
           min-height:44px; padding:0 12px; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  button:active { filter:brightness(1.3); }
  .stop { background:var(--zle) !important; color:#fff !important; font-size:18px; padding:0 22px; min-height:48px; }
  .uklad { display:grid; grid-template-columns:minmax(0, 1fr) clamp(300px, 27vw, 440px); gap:10px; align-items:start;
           max-width:1800px; margin:0 auto; }
  @media (max-width:820px) { .uklad { grid-template-columns:1fr; } }
  :root { --prop:1.3333; }
  .wideo { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:var(--prop);
           width:min(100%, calc((100dvh - 200px) * var(--prop))); margin:0 auto; }
  .sektory, .opis { width:min(100%, calc((100dvh - 200px) * var(--prop))); margin-left:auto; margin-right:auto; }
  @media (max-width:820px) { .wideo, .sektory, .opis { width:100%; } }
  /* telefon w poziomie (niski ekran): mniejszy nagłówek, panel obok obrazu z przewijaniem */
  @media (max-height:520px) and (min-width:560px) {
    header h1 { font-size:1rem; } .stop { min-height:40px; padding:0 14px; }
    .uklad { grid-template-columns:minmax(0, 1fr) clamp(240px, 34vw, 340px); }
    .uklad > aside { max-height:calc(100dvh - 90px); overflow-y:auto; }
    .wideo, .sektory, .opis { width:min(100%, calc((100dvh - 120px) * var(--prop))); }
    .opis { font-size:0.9rem; padding:6px 10px; min-height:0; } }
  .wideo img, .wideo canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .wideo canvas { touch-action:none; cursor:crosshair; }
  .brak { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--szary); text-align:center; padding:20px; }
  .sektory { display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; margin-top:6px; }
  .sektory div { height:10px; border-radius:3px; background:var(--linia); }
  .opis { background:var(--panel2); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:16px; min-height:44px; }
  .panel { background:var(--panel); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .tryby { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:6px; }
  .tryby button.wl { background:var(--akcent); color:#111; }
  .opcje { display:flex; flex-direction:column; gap:8px; }
  .chipy { display:flex; flex-wrap:wrap; gap:6px; }
  .chipy button { min-height:36px; font-size:14px; border-radius:18px; }
  .chipy button.wl { background:var(--ok); color:#0b0b0b; }
  label.suwak { display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--szary); }
  input[type=range] { width:100%; accent-color:var(--akcent); }
  .zdj { display:flex; gap:6px; overflow-x:auto; }
  .zdj img { height:60px; border-radius:6px; }
  details summary { cursor:pointer; color:var(--szary); font-size:14px; }
  .maly { font-size:13px; color:var(--szary); margin:0; }
  .blad { color:var(--zle); font-size:13px; margin:0; }
  a { color:var(--akcent); }
  .jedz-za { background:var(--ok) !important; color:#0b0b0b !important; }
  .pasek { height:8px; background:var(--linia); border-radius:4px; overflow:hidden; }
  .pasek i { display:block; height:100%; background:var(--ok); }

  /* ---- kokpit: jazda ręczna przyciskami, podgląd pomiędzy ---- */
  .kokpit-gora, .kokpit-l, .kokpit-p, .pelny-hud { display:none; }
  body.kokpit .uklad > aside, body.kokpit header { display:none; }
  body.kokpit .uklad { grid-template-columns:1fr; }
  body.kokpit .kokpit-gora { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  body.kokpit .scena { display:grid; grid-template-columns:clamp(96px, 13vw, 200px) minmax(0, 1fr) clamp(96px, 13vw, 200px);
                       grid-template-areas:"l w p"; gap:10px; align-items:center; }
  body.kokpit .wideo { grid-area:w; aspect-ratio:auto; width:100%; height:calc(100dvh - 190px); min-height:160px; }
  @media (max-height:520px) { body.kokpit .wideo { height:calc(100dvh - 110px); } body.kokpit .sektory, body.kokpit .opis { display:none; } }
  body.kokpit .kokpit-l { grid-area:l; } body.kokpit .kokpit-p { grid-area:p; }
  body.kokpit .kokpit-l, body.kokpit .kokpit-p { display:flex; flex-direction:column; gap:10px; }
  .kokpit-l button, .kokpit-p button { min-height:clamp(80px, 18dvh, 180px); font-size:clamp(28px, 4vw, 52px); border-radius:16px; touch-action:none; }
  .kokpit-p .rzad { display:flex; gap:8px; } .kokpit-p .rzad button { flex:1; }
  .trzym { background:var(--akcent) !important; color:#111 !important; }
  @media (max-aspect-ratio:1/1) {  /* telefon w pionie: obraz na górze, gaz i skręt pod nim */
    body.kokpit .scena { grid-template-columns:1fr 1fr; grid-template-areas:"w w" "l p"; }
    body.kokpit .wideo { height:auto; aspect-ratio:4/3; }
    body.kokpit .kokpit-l { flex-direction:row; } body.kokpit .kokpit-l button { flex:1; }
    .kokpit-l button, .kokpit-p button { min-height:96px; font-size:32px; } }

  /* ---- pełny ekran: pad Xbox albo klawiatura ---- */
  body.pelny { padding:0; overflow:hidden; }
  body.pelny header, body.pelny .uklad > aside, body.pelny .sektory, body.pelny .kokpit-gora,
  body.pelny .kokpit-l, body.pelny .kokpit-p { display:none !important; }
  body.pelny .uklad { display:block; }
  body.pelny .wideo { position:fixed; inset:0; border-radius:0; aspect-ratio:auto; z-index:1; width:auto !important; margin:0; }
  body.pelny .opis { position:fixed; left:12px; bottom:12px; right:200px; z-index:3; background:rgba(13,17,20,.72); margin:0; width:auto !important; }
  body.pelny .pelny-hud { display:flex; position:fixed; top:calc(36px + env(safe-area-inset-top, 0px)); left:12px; right:12px; z-index:3; gap:8px;
    align-items:center; flex-wrap:wrap; }
  .pelny-hud .etyk { background:rgba(13,17,20,.72); border-radius:8px; padding:6px 10px; font-size:14px; }
  .pelny-hud .stop { margin-left:auto; }
  .spusty { display:inline-flex; align-items:center; gap:6px; }
  .sp { display:inline-block; width:70px; height:10px; background:var(--linia); border-radius:5px; overflow:hidden; }
  .sp i { display:block; height:100%; width:0; background:var(--akcent); }

  /* ---- wysuwany panel stanu (zawsze, w każdym trybie i widoku) ---- */
  .szuflada { position:fixed; top:0; left:50%; z-index:5; display:flex; flex-direction:column; align-items:center;
              transform:translate(-50%, calc(-100% + 30px)); transition:transform .25s ease; width:min(560px, 96vw); }
  .szuflada.otwarta { transform:translate(-50%, 0); }
  @media (prefers-reduced-motion:reduce) { .szuflada { transition:none; } }
  .uchwyt { order:2; min-height:30px; padding:0 14px; border-radius:0 0 10px 10px; background:var(--panel2); font-size:13px;
            display:flex; align-items:center; gap:8px; box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .uchwyt b { color:var(--akcent); }
  .szuflada .tresc { order:1; width:100%; background:rgba(22,28,33,.97); border-radius:0 0 10px 10px; padding:12px;
                     display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .szuflada .tresc .maly, .szuflada .tresc .czujnik, .szuflada .tresc .blad, .szuflada .tresc .przypnij { grid-column:1 / -1; }
  @media (max-width:500px) { .szuflada .tresc { grid-template-columns:1fr; } }
  .wiersz { display:flex; flex-direction:column; gap:3px; font-size:13px; }
  .wiersz .g { display:flex; justify-content:space-between; gap:8px; }
  .wiersz .g span:first-child { color:var(--szary); }
  .wiersz .g span:last-child { font-weight:600; font-variant-numeric:tabular-nums; }
  .wiersz .pasek { height:6px; }
  .czujnik { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; text-align:center; }
  .czujnik div { background:var(--panel2); border-radius:8px; padding:6px 2px; }
  .czujnik b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .czujnik small { color:var(--szary); font-size:11px; }
  .przypnij { min-height:30px; font-size:12px; }

  /* ---- ekran ustawień ---- */
  .ustaw { position:fixed; inset:0; z-index:10; background:var(--tlo); display:none; flex-direction:column;
           padding:calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left)); }
  .ustaw.otwarte { display:flex; }
  .ustaw-gora { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .ustaw-gora h2 { margin:0; font-size:1.3rem; flex:1; }
  .zakladki { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; flex:none; }
  .zakladki button { white-space:nowrap; }
  .zakladki button.wl { background:var(--akcent); color:#111; }
  .ustaw-tresc { flex:1; overflow-y:auto; max-width:900px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px 30px; }
  .pole { background:var(--panel); border-radius:10px; padding:10px 12px; display:grid; grid-template-columns:minmax(0, 1fr) auto;
          gap:4px 12px; align-items:center; }
  .pole label { font-weight:600; } .pole .wart { font-variant-numeric:tabular-nums; color:var(--akcent); font-weight:600; }
  .pole input[type=range], .pole select { grid-column:1 / -1; }
  .pole small { grid-column:1 / -1; color:var(--szary); font-size:0.85rem; }
  .pole.nieakt { opacity:.5; }
  select { font:1rem system-ui, sans-serif; background:var(--panel2); color:var(--tekst); border:0; border-radius:8px; min-height:40px; padding:0 8px; }
  .przel { position:relative; width:52px; height:30px; border-radius:15px; background:var(--linia); border:0; min-height:0; padding:0; }
  .przel::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .15s; }
  .przel.wl { background:var(--ok); } .przel.wl::after { left:25px; }
  .sekcja { color:var(--szary); font-size:0.9rem; margin:8px 2px 0; }
</style>
</head>
<body>
<header>
  <h1>Łazik · sterowanie</h1>
  <span class="lacze" id="lacze"><i></i><span>łączę…</span></span>
  <button class="stop" id="stop" title="Zatrzymaj (spacja / B na padzie)">STOP</button>
</header>
<div class="kokpit-gora">
  <button id="wyjdz">← tryby</button>
  <button class="otworz-ustaw" aria-label="Ustawienia">⚙</button>
  <button id="napelny">Pełny ekran (pad / klawiatura)</button>
  <span class="lacze" id="lacze2" style="margin-left:auto"><i></i><span></span></span>
  <button class="stop" id="stop2">STOP</button>
</div>
<div class="pelny-hud">
  <button id="nakokpit">Przyciski</button>
  <span class="etyk" id="hud_tryb"></span>
  <span class="etyk" id="hud_pad"></span>
  <span class="etyk" id="hud_moc" title="X na padzie przełącza tryb mocy"></span>
  <span class="etyk spusty" id="hud_spusty"><span>LT</span><span class="sp"><i id="sp_lt"></i></span><span>RT</span><span class="sp"><i id="sp_rt"></i></span></span>
  <button class="stop" id="stop3">STOP</button>
</div>
<div class="uklad">
  <section>
    <div class="scena">
      <div class="kokpit-l" aria-label="Gaz">
        <button data-gaz="1" aria-label="Do przodu">▲</button>
        <button data-gaz="-1" aria-label="Do tyłu">▼</button>
      </div>
      <div class="wideo">
        <img id="obraz" alt="Podgląd z kamery łazika">
        <canvas id="nakladka"></canvas>
        <div class="brak" id="brak">Łączę z kamerą…</div>
      </div>
      <div class="kokpit-p" aria-label="Skręt">
        <div class="rzad"><button data-skret="-1" aria-label="W lewo">◀</button><button data-skret="1" aria-label="W prawo">▶</button></div>
        <p class="maly" style="text-align:center">gaz z lewej, skręt z prawej: można trzymać oba naraz</p>
      </div>
    </div>
    <div class="sektory" id="sektory" title="Wolne miejsce przed łazikiem (z głębi): zielone = wolno, czerwone = blisko">
      <div></div><div></div><div></div><div></div><div></div>
    </div>
    <div class="opis" id="opis">…</div>
  </section>
  <aside class="panel">
    <div class="tryby" id="tryby"></div>
    <div class="opcje" id="opcje"></div>
    <div id="bledy"></div>
    <button id="otworz_ustaw">⚙ Ustawienia (kamera, Hailo, napęd, tryby…)</button>
  </aside>
</div>

<div class="ustaw" id="ustaw" role="dialog" aria-label="Ustawienia">
  <div class="ustaw-gora"><h2>Ustawienia</h2><button id="zamknij_ustaw" aria-label="Zamknij">✕</button></div>
  <div class="zakladki" id="zakladki"></div>
  <div class="ustaw-tresc" id="ustaw_tresc"></div>
</div>

<div class="szuflada" id="szuflada">
  <button class="uchwyt" id="uchwyt" aria-label="Pokaż stan łazika"><span>▾ Stan łazika</span> <b id="uchwyt_t"></b></button>
  <div class="tresc">
    <div class="wiersz"><div class="g"><span>Procesor</span><span id="s_cpu">—</span></div><div class="pasek"><i id="p_cpu"></i></div></div>
    <div class="wiersz"><div class="g"><span>Hailo</span><span id="s_hailo">—</span></div><div class="pasek"><i id="p_hailo"></i></div></div>
    <div class="wiersz"><div class="g"><span>RAM</span><span id="s_ram">—</span></div><div class="pasek"><i id="p_ram"></i></div></div>
    <div class="wiersz"><div class="g"><span>Zasilanie</span><span id="s_zas">—</span></div></div>
    <div class="wiersz"><div class="g"><span>Kamera / wizja</span><span id="s_kl">—</span></div></div>
    <div class="wiersz"><div class="g"><span>Silniki L / P</span><span id="s_nap">—</span></div></div>
    <div class="wiersz"><div class="g"><span>Pad (X = tryb mocy)</span><span id="s_pad">—</span></div></div>
    <div class="maly">Czujnik BME280</div>
    <div class="czujnik" id="czujnik">
      <div><b id="c_t">—</b><small>°C</small></div><div><b id="c_h">—</b><small>% wilg.</small></div><div><b id="c_p">—</b><small>hPa</small></div>
    </div>
    <p class="blad" id="c_blad"></p>
    <button class="przypnij" id="przypnij">Przypnij panel</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const api = (u, d) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d || {}) });
let S = null, zaznaczony = null, widok = 'zwykly';
const pamiec = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
                 set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };

// ---------- widoki ----------
function ustawWidok(w) {
  widok = w;
  document.body.classList.toggle('kokpit', w === 'kokpit');
  document.body.classList.toggle('pelny', w === 'pelny');
  setTimeout(rysuj, 50);
}
function wejdzPelny() {
  ustawWidok('pelny');
  if (document.fullscreenElement == null && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(() => {});  // wymaga gestu: klawiatura tak, pad nie (wtedy cała strona i tak wypełnia okno)
}
function wyjdzPelny() {
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  ustawWidok(S && S.tryb === 'reczny' ? 'kokpit' : 'zwykly');
}
$('#napelny').onclick = wejdzPelny;
$('#nakokpit').onclick = wyjdzPelny;
$('#wyjdz').onclick = () => api('api/tryb', { tryb: 'stop' }).then(odswiez);
for (const id of ['#stop', '#stop2', '#stop3']) $(id).onclick = () => { skoncz(); api('api/tryb', { tryb: 'stop' }).then(odswiez); };

// ---------- podgląd i zaznaczanie ----------
const obraz = $('#obraz'), plotno = $('#nakladka');
obraz.onload = () => { $('#brak').style.display = 'none'; };
obraz.onerror = () => { $('#brak').style.display = 'flex'; $('#brak').textContent = 'Brak obrazu z kamery. Ponawiam…';
  setTimeout(() => obraz.src = 'strumien.mjpg?' + Date.now(), 2000); };
obraz.src = 'strumien.mjpg';
addEventListener('resize', () => rysuj());

function prostokat() {  // gdzie na płótnie leży sam obraz z kamery (object-fit: contain; przy podglądzie z głębią: lewa połowa)
  const p = S ? S.proporcje : 4 / 3, W = plotno.clientWidth, H = plotno.clientHeight;
  const w = Math.min(W, H * p), h = w / p, x = (W - w) / 2, y = (H - h) / 2;
  return p > 2 ? { x, y, w: w / 2, h } : { x, y, w, h };
}
function rysuj() {
  const dpr = devicePixelRatio || 1;
  plotno.width = plotno.clientWidth * dpr; plotno.height = plotno.clientHeight * dpr;
  const c = plotno.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!S) return;
  const r = prostokat();
  c.font = '600 14px system-ui';
  for (const o of S.obiekty) {
    const [x0, y0, x1, y1] = o.ramka, x = r.x + x0 * r.w, y = r.y + y0 * r.h, w = (x1 - x0) * r.w, h = (y1 - y0) * r.h;
    const cel = o.id === S.cel_id, zazn = o.id === zaznaczony;
    const kol = cel ? '#3fbf6a' : zazn ? '#e0a640' : `hsl(${(o.klasa * 47) % 360} 80% 65%)`;
    c.strokeStyle = kol; c.lineWidth = cel || zazn ? 4 : 2; c.strokeRect(x, y, w, h);
    const t = `${cel ? '● ' : ''}#${o.id} ${o.nazwa} ${Math.round(o.pew * 100)}%`, tw = c.measureText(t).width + 10;
    const ty = y > 22 ? y - 22 : y + h;
    c.fillStyle = kol; c.fillRect(x, ty, tw, 22); c.fillStyle = '#0b0b0b'; c.fillText(t, x + 5, ty + 16);
  }
}
plotno.addEventListener('click', e => {
  if (!S) return;
  const b = plotno.getBoundingClientRect(), r = prostokat();
  const nx = (e.clientX - b.left - r.x) / r.w, ny = (e.clientY - b.top - r.y) / r.h;
  const traf = S.obiekty.filter(o => o.ramka[0] <= nx && nx <= o.ramka[2] && o.ramka[1] <= ny && ny <= o.ramka[3])
    .sort((a, b) => (a.ramka[2] - a.ramka[0]) * (a.ramka[3] - a.ramka[1]) - (b.ramka[2] - b.ramka[0]) * (b.ramka[3] - b.ramka[1]));
  zaznaczony = traf.length ? traf[0].id : null;
  if (zaznaczony !== null && S.tryb === 'sledz') api('api/cel', { id: zaznaczony });
  opcje(true); rysuj();
});

// ---------- tryby i opcje ----------
function przyciskiTrybow() {
  const t = $('#tryby'); t.innerHTML = '';
  for (const [k, n] of Object.entries(S.tryby)) {
    if (k === 'stop') continue;
    const b = document.createElement('button'); b.textContent = n; b.classList.toggle('wl', S.tryb === k);
    b.onclick = () => api('api/tryb', { tryb: k }).then(odswiez); t.append(b);
  }
}
let ostatnieOpcje = '';
function opcje(wymus) {

}

// ---------- jazda ręczna: przyciski (wielodotyk), klawiatura, pad ----------
const dotyk = { gaz: 0, skret: 0 };
const wcisniete = new Set();
const pad = { v: 0, s: 0, czas: 0, nazwa: '' };
let wysylanie = null, ostatniRuch = '0,0';
function ruch() {
  if (performance.now() - pad.czas < 300) return { v: pad.v, s: pad.s, pelna: !!pad.pelna };
  let v = dotyk.gaz, s = dotyk.skret;
  for (const k of wcisniete) { v += klawisze[k][0]; s += klawisze[k][1]; }
  return { v: Math.max(-1, Math.min(1, v)), s: Math.max(-1, Math.min(1, s)), pelna: false };
}
function wyslij() {
  const r = ruch(), k = r.v.toFixed(2) + ',' + r.s.toFixed(2);
  if (S && S.tryb === 'reczny') api('api/reczny', r);
  if (k === '0.00,0.00' && ostatniRuch === k) { clearInterval(wysylanie); wysylanie = null; }
  ostatniRuch = k;
}
function zmiana() { wyslij(); if (!wysylanie) wysylanie = setInterval(wyslij, 120); }
function skoncz() { dotyk.gaz = dotyk.skret = 0; wcisniete.clear(); pad.czas = 0; zmiana(); }
document.querySelectorAll('.kokpit-l button, .kokpit-p button').forEach(b => {
  const gaz = b.dataset.gaz !== undefined ? +b.dataset.gaz : null, skret = b.dataset.skret !== undefined ? +b.dataset.skret : null;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); b.classList.add('trzym'); try { b.setPointerCapture(e.pointerId); } catch (_) {}
    if (gaz !== null) dotyk.gaz = gaz; else dotyk.skret = skret; zmiana();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => b.addEventListener(n, () => {
    if (!b.classList.contains('trzym')) return;
    b.classList.remove('trzym'); if (gaz !== null) dotyk.gaz = 0; else dotyk.skret = 0; zmiana();
  }));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
const klawisze = { ArrowUp: [1, 0], KeyW: [1, 0], ArrowDown: [-1, 0], KeyS: [-1, 0], ArrowLeft: [0, -1], KeyA: [0, -1], ArrowRight: [0, 1], KeyD: [0, 1] };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); $('#stop').click(); return; }
  if (e.code === 'Escape' && widok === 'pelny') { wyjdzPelny(); return; }
  if (klawisze[e.code] && S && S.tryb === 'reczny') {
    e.preventDefault();
    if (widok !== 'pelny') wejdzPelny();
    if (!wcisniete.has(e.code)) { wcisniete.add(e.code); zmiana(); }
  }
});
addEventListener('keyup', e => { if (wcisniete.delete(e.code)) zmiana(); });

// Pad Xbox (Gamepad API). X przełącza tryb mocy:
//   ustawienia: lewa gałka = jazda, moc do „maks. moc” z ustawień
//   spusty:     RT = płynny gaz do przodu, LT = do tyłu (0–100% mocy), gałka = skręt
//   pełna moc:  lewa gałka = jazda do 100% mocy
// B = STOP, Start = tryb ręczny. Działa na stronie z HTTPS albo otwartej na samym Pi (localhost).
const TRYBY_MOCY = { ustawienia: 'Moc: z ustawień', spusty: 'Moc: spusty RT/LT', pelna: 'Moc: PEŁNA' };
let trybMocy = pamiec.get('lazik_moc') || 'ustawienia';
if (!TRYBY_MOCY[trybMocy]) trybMocy = 'ustawienia';
let poprzB = false, poprzStart = false, poprzX = false;
const spust = { lt: 0, rt: 0, plynne: false };
function odczytSpustow(gp) {
  // standardowe mapowanie: przyciski 6/7 z wartością 0..1; inne przeglądarki: osie 2/5 w zakresie -1..1
  let lt = gp.buttons[6] ? gp.buttons[6].value : 0, rt = gp.buttons[7] ? gp.buttons[7].value : 0;
  if (gp.mapping !== 'standard' && gp.axes.length >= 6) {
    lt = Math.max(lt, (gp.axes[2] + 1) / 2); rt = Math.max(rt, (gp.axes[5] + 1) / 2);
  }
  if ((lt > 0.02 && lt < 0.98) || (rt > 0.02 && rt < 0.98)) spust.plynne = true;  // widać wartości pośrednie = spusty płynne
  spust.lt = lt; spust.rt = rt;
}
function petlaPada() {
  const gp = (navigator.getGamepads ? [...navigator.getGamepads()] : []).find(g => g && g.connected);
  if (gp) {
    pad.nazwa = gp.id.split('(')[0].trim().slice(0, 32);
    odczytSpustow(gp);
    const mz = x => Math.abs(x) < 0.15 ? 0 : x;
    const gy = mz(-(gp.axes[1] || 0));
    const sx = mz([gp.axes[0] || 0, gp.axes[2] && gp.mapping === 'standard' ? gp.axes[2] : 0]
      .reduce((a, b) => Math.abs(b) > Math.abs(a) ? b : a, 0));
    const b = gp.buttons[1] && gp.buttons[1].pressed, st = gp.buttons[9] && gp.buttons[9].pressed;
    const x = gp.buttons[2] && gp.buttons[2].pressed;
    if (b && !poprzB) $('#stop').click();
    if (st && !poprzStart) api('api/tryb', { tryb: 'reczny' }).then(odswiez);
    if (x && !poprzX) {
      const kol = Object.keys(TRYBY_MOCY); trybMocy = kol[(kol.indexOf(trybMocy) + 1) % kol.length];
      pamiec.set('lazik_moc', trybMocy); pokazTrybMocy();
    }
    poprzB = b; poprzStart = st; poprzX = x;
    let v = gy;
    if (trybMocy === 'spusty') v = Math.max(-1, Math.min(1, (spust.rt < 0.03 ? 0 : spust.rt) - (spust.lt < 0.03 ? 0 : spust.lt)));
    pad.pelna = trybMocy !== 'ustawienia';
    if (v || sx) {
      if (S && S.tryb === 'reczny' && widok !== 'pelny') wejdzPelny();
      pad.v = v; pad.s = sx; pad.czas = performance.now(); zmiana();
    } else if (performance.now() - pad.czas < 300) { pad.v = pad.s = 0; pad.czas = performance.now(); zmiana(); }
    $('#sp_lt').style.width = Math.round(spust.lt * 100) + '%'; $('#sp_rt').style.width = Math.round(spust.rt * 100) + '%';
  } else pad.nazwa = '';
  requestAnimationFrame(petlaPada);
}
function pokazTrybMocy() {
  const t = TRYBY_MOCY[trybMocy] + (trybMocy === 'ustawienia' && S ? ` (${Math.round(S.maks_moc * 100)}%)` : '');
  $('#hud_moc').textContent = t;
  $('#hud_moc').style.background = trybMocy === 'pelna' ? 'rgba(229,83,75,.85)' : '';
  $('#hud_spusty').style.display = trybMocy === 'spusty' ? '' : 'none';
}
requestAnimationFrame(petlaPada);
addEventListener('gamepadconnected', e => { pad.nazwa = e.gamepad.id; });

// ---------- ekran ustawień ----------
let schemat = null, zakladka = pamiec.get('lazik_zakladka') || 'Kamera';
const ZAKLADKA_SYSTEM = 'System';
async function otworzUstawienia() {
  schemat = await (await fetch('api/schemat')).json();
  $('#ustaw').classList.add('otwarte');
  rysujZakladki(); rysujUstawienia();
}
document.querySelectorAll('#otworz_ustaw, .otworz-ustaw').forEach(b => b.onclick = otworzUstawienia);
$('#zamknij_ustaw').onclick = () => $('#ustaw').classList.remove('otwarte');
function rysujZakladki() {
  const nazwy = [...new Set(schemat.pola.map(p => p.zakladka)), ZAKLADKA_SYSTEM];
  if (!nazwy.includes(zakladka)) zakladka = nazwy[0];
  const z = $('#zakladki'); z.innerHTML = '';
  for (const n of nazwy) {
    const b = document.createElement('button'); b.textContent = n; b.classList.toggle('wl', n === zakladka);
    b.onclick = () => { zakladka = n; pamiec.set('lazik_zakladka', n); rysujZakladki(); rysujUstawienia(); };
    z.append(b);
  }
}
const zapisz = (k, v) => api('api/ustawienia', { [k]: v }).then(r => r.json()).then(d => { if (d.konf) schemat.wartosci[k] = d.konf[k]; });
function polePrzelacznik(etykieta, wl, naZmiane, podpowiedz, nieakt) {
  const d = document.createElement('div'); d.className = 'pole' + (nieakt ? ' nieakt' : '');
  d.innerHTML = `<label>${etykieta}</label>`;
  const b = document.createElement('button'); b.className = 'przel' + (wl ? ' wl' : ''); b.setAttribute('aria-pressed', wl);
  b.onclick = () => { wl = !wl; b.classList.toggle('wl', wl); b.setAttribute('aria-pressed', wl); naZmiane(wl); };
  d.append(b);
  if (podpowiedz) d.insertAdjacentHTML('beforeend', `<small>${podpowiedz}</small>`);
  return d;
}
function poleSuwak(etykieta, mn, mx, krok, wart, format, naZmiane, podpowiedz, nieakt) {
  const d = document.createElement('div'); d.className = 'pole' + (nieakt ? ' nieakt' : '');
  d.innerHTML = `<label>${etykieta}</label><span class="wart"></span><input type="range" min="${mn}" max="${mx}" step="${krok}" value="${wart}">` +
    (podpowiedz ? `<small>${podpowiedz}</small>` : '');
  const w = d.querySelector('.wart'), i = d.querySelector('input');
  const pokaz = () => w.textContent = format(+i.value); pokaz();
  i.oninput = pokaz; i.onchange = () => naZmiane(+i.value);
  return d;
}
function poleWybor(etykieta, opcje, wart, naZmiane, podpowiedz, nieakt) {
  const d = document.createElement('div'); d.className = 'pole' + (nieakt ? ' nieakt' : '');
  d.innerHTML = `<label>${etykieta}</label>` + (podpowiedz ? `<small>${podpowiedz}</small>` : '');
  const sel = document.createElement('select');
  for (const [v, o] of opcje) { const op = document.createElement('option'); op.value = v; op.textContent = o; op.selected = String(v) === String(wart); sel.append(op); }
  sel.onchange = () => naZmiane(sel.value);
  d.insertBefore(sel, d.querySelector('small'));
  return d;
}
function format(p) {
  const [mn, mx, krok] = p.opcje;
  if (mx <= 1 && krok < 1) return v => Math.round(v * 100) + '%';
  return v => String(v).replace('.', ',');
}
async function rysujUstawienia() {
  const t = $('#ustaw_tresc'); t.innerHTML = '';
  if (zakladka === ZAKLADKA_SYSTEM) return rysujSystem(t);
  for (const p of schemat.pola.filter(p => p.zakladka === zakladka)) {
    const v = schemat.wartosci[p.klucz];
    if (p.typ === 'tak_nie') t.append(polePrzelacznik(p.podpis, v, x => zapisz(p.klucz, x), p.podpowiedz));
    else if (p.typ === 'suwak') t.append(poleSuwak(p.podpis, ...p.opcje, v, format(p), x => zapisz(p.klucz, x), p.podpowiedz));
    else t.append(poleWybor(p.podpis, p.opcje, v, x => zapisz(p.klucz, x), p.podpowiedz));
  }
  if (zakladka === 'Kamera') await rysujKontrolkiKamery(t);
  const b = document.createElement('button'); b.textContent = `Przywróć domyślne: ${zakladka}`;
  b.onclick = async () => { await api('api/ustawienia/domyslne', { zakladka }); schemat = await (await fetch('api/schemat')).json(); rysujUstawienia(); };
  t.append(b);
}
async function rysujKontrolkiKamery(t) {
  t.insertAdjacentHTML('beforeend', '<p class="sekcja">Regulacje tej kamery (zapamiętywane i przywracane przy każdym włączeniu)</p>');
  const box = document.createElement('div'); box.style.cssText = 'display:flex;flex-direction:column;gap:10px'; t.append(box);
  const d = await (await fetch('api/kamera/kontrolki')).json();
  if (!d.kontrolki.length) { box.innerHTML = '<p class="maly">Kamera jest teraz wyłączona albo nie zgłasza regulacji. Otwórz podgląd i spróbuj ponownie.</p>'; return; }
  const ustaw = async (n, v) => { const r = await api('api/kamera/kontrolki', { nazwa: n, wartosc: v }); if (!r.ok) alert((await r.json()).blad); setTimeout(() => { box.remove(); rysujKontrolkiKamery(t).then(przesunPrzycisk); }, 300); };
  const przesunPrzycisk = () => { const b = t.querySelector('button:last-of-type'); if (b) t.append(b); };
  for (const c of d.kontrolki) {
    const pod = c.nieaktywna ? 'Nieaktywne przy obecnych ustawieniach (np. przy automatycznej ekspozycji).' : '';
    if (c.typ === 'bool') box.append(polePrzelacznik(c.podpis, !!c.wartosc, x => ustaw(c.nazwa, x ? 1 : 0), pod, c.nieaktywna));
    else if (c.typ === 'menu') box.append(poleWybor(c.podpis, c.menu, c.wartosc, x => ustaw(c.nazwa, +x), pod, c.nieaktywna));
    else if (c.typ === 'int') box.append(poleSuwak(c.podpis, c.min, c.max, c.krok, c.wartosc, v => `${v} (dom. ${c.domyslnie})`, x => ustaw(c.nazwa, x), pod, c.nieaktywna));
  }
}
function rysujSystem(t) {
  const adr = location.origin;
  t.insertAdjacentHTML('beforeend', `<div class="pole"><label>Model rozpoznawania</label><span class="wart">${S ? S.model || '—' : '—'}</span></div>
    <div class="pole"><label>Kamera</label><span class="wart">${S ? S.kamera : '—'}</span></div>
    <div class="pole"><label>Adres tej strony</label><span class="wart" style="word-break:break-all">${adr}</span>
      <small>HTTPS przez Tailscale (pad Xbox działa): https://rpi-5-1.tail52831c.ts.net/ · w domu: http://172.23.0.15:8000/</small></div>`);
  const b = document.createElement('button'); b.textContent = 'Uruchom usługę ponownie';
  b.onclick = async () => { b.disabled = true; b.textContent = 'Uruchamiam ponownie…'; await api('api/restart'); setTimeout(() => location.reload(), 6000); };

async function odswiez() {

    for (const id of ['#lacze', '#lacze2']) { $(id).className = 'lacze ok'; $(id + ' span').textContent = `${S.fps} kl/s`; }

    document.documentElement.style.setProperty('--prop', S.proporcje.toFixed(4));
    if (S.tryb !== poprzTryb) {  // wejście w tryb ręczny = kokpit; wyjście = zwykły widok
      if (S.tryb === 'reczny' && widok === 'zwykly') ustawWidok('kokpit');
      if (S.tryb !== 'reczny' && widok !== 'zwykly') wyjdzPelny();
      poprzTryb = S.tryb;
    }
    $('#hud_tryb').textContent = S.tryby[S.tryb] + ' · ' + S.fps + ' kl/s';
    $('#hud_pad').textContent = pad.nazwa ? 'Pad: ' + pad.nazwa : 'klawiatura: strzałki / WASD · Esc = przyciski';
    przyciskiTrybow(); opcje(false); rysuj(); panelStanu();
    const sek = $('#sektory').children;
    for (let i = 0; i < 5; i++) {
      const v = S.sektory ? S.sektory[i] : null;
      sek[i].style.background = v === null ? 'var(--linia)' : v < 0.45 ? 'var(--zle)' : v < 0.8 ? 'var(--akcent)' : 'var(--ok)';
    }
    $('#bledy').innerHTML = [S.blad_napedu, S.blad_wizji].filter(Boolean).map(b => `<p class="blad">${b}</p>`).join('');
  } catch (_) {
    for (const id of ['#lacze', '#lacze2']) { $(id).className = 'lacze'; $(id + ' span').textContent = 'brak połączenia'; }
  }
}
setInterval(odswiez, 250);
setInterval(() => api('api/puls').catch(() => {}), 1000);
api('api/puls'); odswiez();
</script>
