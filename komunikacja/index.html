<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Komunikacja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Komunikacja miejska ZTM Poznań: odjazdy i trasy z /api/ztm/... (moduł portalu ztm.py), lokalizacja z /api/lokalizacja. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16202C; --muted:#56606E; --line:#D5DBE3; --soft:#E4E9F0;
  --nav:#1F3A5F; --navInk:#FFFFFF; --sel:#1d63c4; --ok:#1f8a4c; --warn:#a86b00; --bad:#c03442;
  --serif:"Alegreya",Georgia,serif; --sans:"Alegreya Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
    --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
  --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
h1,h2{font-family:var(--serif);line-height:1.15;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--nav);color:var(--navInk);padding:14px 0 18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header.top .back{display:inline-block;font-size:14px;opacity:.75;text-decoration:none;color:inherit;margin-bottom:8px}
header.top h1{font-size:clamp(30px,7vw,42px);font-weight:800}
header.top p{margin:4px 0 0;opacity:.8;font-size:15px}
main{padding:18px 0 60px}
.siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.karta,div.karta{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:inherit;text-decoration:none}
a.karta:hover{border-color:var(--sel)}
.karta h2{font-size:23px;display:flex;gap:8px;align-items:center}
.karta .opis{color:var(--muted);font-size:15px;margin:4px 0 10px}
.karta .stan{font-weight:700;font-size:15px}
.karta .stan .uw{color:var(--bad)} .karta .stan .dzis{color:var(--warn)}
.karta.wkrotce{opacity:.65;border-style:dashed}
.znaczek{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:auto;font-family:var(--sans)}
ul{margin:0;padding-left:18px;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:22px;margin-bottom:8px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 160px;min-width:0;height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit}
button{height:44px;border:1.5px solid var(--sel);background:var(--sel);color:#fff;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}
button.jasny{background:var(--surface);color:inherit;border-color:var(--line)}
pre{white-space:pre-wrap;font-family:var(--sans);font-size:16px;margin:10px 0 0;line-height:1.55}
.muted{color:var(--muted);font-size:14px}
.szybkie{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="/strony/automatyczne/">← Automatyczne</a>
  <h1>🚌 Komunikacja</h1>
  <p>ZTM Poznań: odjazdy i trasy z opóźnieniami na żywo. „tu” = Twoja ostatnia lokalizacja.</p>
</div></header>
<main><div class="wrap">
  <div class="card"><h2>📍 Gdzie jestem</h2><div id="loc" class="muted">…</div>
    <div class="szybkie"><button type="button" class="jasny" data-trasa="dom">🏠 Do domu</button><button type="button" class="jasny" data-odj="tu">🚏 Odjazdy obok</button></div>
    <pre id="szybki"></pre></div>
  <div class="card"><h2>🚏 Odjazdy</h2>
    <form id="fOdj"><input id="przyst" placeholder="Przystanek, np. Junikowo" autocomplete="off"><button>Pokaż</button></form><pre id="odj"></pre></div>
  <div class="card"><h2>🗺 Trasa</h2>
    <form id="fTr"><input id="skad" placeholder="Skąd (puste = tu)" autocomplete="off"><input id="dokad" placeholder="Dokąd, np. dom, Rondo Kaponiera, adres" autocomplete="off"><button>Szukaj</button></form><pre id="tr"></pre></div>
  <div class="card"><h2>⭐ Miejsca</h2><div id="mj" class="muted"></div>
    <form id="fMj" style="margin-top:8px"><input id="mjN" placeholder="Nazwa, np. dom" autocomplete="off"><input id="mjA" placeholder="Adres (puste = tu, gdzie jestem)" autocomplete="off"><button>Zapisz</button></form></div>
</div></main>
<script>
const $ = id => document.getElementById(id);
const pobierz = async url => { const r = await fetch(url, {cache:"no-store"}); const d = await r.json(); return d.tekst || d.blad || "Brak danych."; };
async function lok(){
  const d = await (await fetch("/api/lokalizacja", {cache:"no-store"})).json();
  const l = d.lokalizacja;
  $("loc").textContent = l ? `Ostatnio: ${l.czas.replace("T", " ").slice(0, 16)} (${l.zrodlo}), dokładność ${l.dokladnosc_m ?? "?"} m` : "Pi nie zna jeszcze Twojej lokalizacji: wyślij ją przyciskiem 📍 w Telegramie albo włącz OwnTracks.";
  const m = Object.values(d.miejsca || {});
  $("mj").textContent = m.length ? m.map(x => `${x.nazwa}${x.opis ? " (" + x.opis + ")" : ""}`).join(" · ") : "Brak. Zapisz np. „dom”.";
}
document.querySelectorAll("[data-trasa]").forEach(b => b.onclick = async () => { $("szybki").textContent = "Szukam…"; $("szybki").textContent = await pobierz(`/api/ztm/trasa?skad=tu&dokad=${encodeURIComponent(b.dataset.trasa)}`); });
document.querySelectorAll("[data-odj]").forEach(b => b.onclick = async () => { $("szybki").textContent = "Szukam…"; $("szybki").textContent = await pobierz(`/api/ztm/odjazdy?skad=tu&ile=10`); });
$("fOdj").onsubmit = async e => { e.preventDefault(); $("odj").textContent = "Szukam…"; $("odj").textContent = await pobierz(`/api/ztm/odjazdy?skad=${encodeURIComponent($("przyst").value || "tu")}&ile=12`); };
$("fTr").onsubmit = async e => { e.preventDefault(); $("tr").textContent = "Szukam…"; $("tr").textContent = await pobierz(`/api/ztm/trasa?skad=${encodeURIComponent($("skad").value || "tu")}&dokad=${encodeURIComponent($("dokad").value || "dom")}`); };
$("fMj").onsubmit = async e => {
  e.preventDefault(); const n = $("mjN").value.trim(); if(!n) return;
  const a = $("mjA").value.trim();
  const r = await fetch("/api/miejsca", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(a ? {nazwa:n, adres:a} : {nazwa:n, tu:true})});
  const d = await r.json(); if(d.blad) alert(d.blad); $("fMj").reset(); lok();
};
lok();
</script>
</body>
</html>
