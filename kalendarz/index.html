<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalendarz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Kalendarz: wszystko z terminem (GET /api/kalendarz?od&do&kat). Osobny kalendarz dla każdej kategorii: #nauka,
   #lekcje, #treningi, #zadania, #budziki; #wszystko = wszystko razem. Tylko podgląd, zmiany na stronach źródłowych. */
:root{
  --lekcje:#5b6b82; --nauka:#8a3fb5; --treningi:#1f8a4c; --zadania:#c26a00; --budziki:#c03442;
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16202C; --muted:#56606E; --line:#D5DBE3; --soft:#E4E9F0;
  --nav:#1F3A5F; --navInk:#FFFFFF; --sel:#1d63c4; --ok:#1f8a4c; --warn:#a86b00; --bad:#c03442;
  --serif:"Alegreya",Georgia,serif; --sans:"Alegreya Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
    --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
  --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
h1,h2{font-family:var(--serif);line-height:1.15;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--nav);color:var(--navInk);padding:14px 0 18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header.top .back{display:inline-block;font-size:14px;opacity:.75;text-decoration:none;color:inherit;margin-bottom:8px}
header.top h1{font-size:clamp(30px,7vw,42px);font-weight:800}
header.top p{margin:4px 0 0;opacity:.8;font-size:15px}
main{padding:18px 0 60px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{font:inherit;font-size:15px;font-weight:700;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed=true]{background:var(--sel);border-color:var(--sel);color:#fff}
.kropka{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.pasek{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.pasek h2{font-size:24px;flex:1;text-transform:capitalize}
.pasek button{font:inherit;font-size:16px;font-weight:700;min-width:44px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.siatka7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dn{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.dzien{min-height:74px;border-radius:8px;border:1px solid var(--line);padding:3px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.dzien.inny{opacity:.45}
.dzien.dzis{border-color:var(--sel);border-width:2px}
.dzien.wyb{outline:3px solid var(--sel);outline-offset:-1px}
.dzien .nr{font-size:13px;font-weight:700}
.dzien .ev{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px;color:#fff}
.dzien .wiecej{font-size:11px;color:var(--muted)}
.dzien .kropki{display:none;gap:2px;flex-wrap:wrap}
@media (max-width:520px){ .dzien{min-height:52px} .dzien .ev,.dzien .wiecej{display:none} .dzien .kropki{display:flex} .kropka{width:8px;height:8px} }
.agenda h3{font-size:17px;margin:14px 0 6px;font-family:var(--sans)}
.agenda h3:first-child{margin-top:0}
.zd{display:flex;gap:10px;padding:8px 10px;border-left:5px solid var(--line);background:var(--bg);border-radius:8px;margin-bottom:6px}
.zd .g{font-weight:700;min-width:3.2em;font-size:15px;color:var(--muted)}
.zd .t{font-weight:700}
.zd .o{font-size:14px;color:var(--muted);white-space:pre-line}
.zd.zrobione .t{text-decoration:line-through;opacity:.7}
.zd a{color:var(--sel);font-size:14px}
.muted{color:var(--muted)}
.widok{margin-left:auto}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="/strony/automatyczne/">← Automatyczne</a>
  <h1>🗓️ Kalendarz</h1>
  <p id="podtytul">Wszystko z terminem: lekcje, nauka, treningi, zadania i budziki.</p>
</div></header>
<main><div class="wrap">
  <div class="chips" id="kat" role="group" aria-label="Który kalendarz"></div>
  <div class="card">
    <div class="pasek"><button type="button" id="wstecz" aria-label="Poprzedni miesiąc">‹</button><h2 id="miesiac">…</h2>
      <button type="button" id="dzisBtn">Dziś</button><button type="button" id="dalej" aria-label="Następny miesiąc">›</button></div>
    <div class="siatka7" id="naglowki"></div>
    <div class="siatka7" id="siatka"></div>
  </div>
  <div class="card agenda" id="agenda" aria-live="polite"></div>
  <div data-ustawienia="kalendarz"></div>
</div></main>
<script>
const $ = id => document.getElementById(id);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for(const [n, v] of Object.entries(a)){ if(v == null || v === false) continue; if(n === "text") e.textContent = v; else if(n === "class") e.className = v; else if(n.startsWith("on")) e[n] = v; else e.setAttribute(n, v); } e.append(...k.filter(x => x != null && x !== false)); return e; };
const KAT = [["wszystko", "Wszystko", null], ["nauka", "📚 Nauka", "--nauka"], ["lekcje", "📅 Lekcje", "--lekcje"], ["treningi", "🏃 Treningi", "--treningi"],
             ["zadania", "📝 Zadania", "--zadania"], ["budziki", "⏰ Budziki", "--budziki"]];
const OPIS = {wszystko:"Wszystko z terminem: lekcje, nauka, treningi, zadania i budziki.", nauka:"Sprawdziany, kartkówki, sesje nauki i zadania domowe.",
  lekcje:"Plan lekcji z Mobidziennika (z zastępstwami i odwołaniami, 2 tygodnie).", treningi:"Plan z intervals.icu i wykonane treningi (±5 tygodni).",
  zadania:"Zadania z przypomnieniami (📞 = Pi dzwoni).", budziki:"Kiedy Pi zadzwoni z porannym przeglądem."};
const MIES = ["styczeń", "luty", "marzec", "kwiecień", "maj", "czerwiec", "lipiec", "sierpień", "wrzesień", "październik", "listopad", "grudzień"];
const MIES_D = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
const DNI = ["pon", "wt", "śr", "czw", "pt", "sob", "niedz"], DNI_P = ["poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota", "niedziela"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const kolor = k => getComputedStyle(document.documentElement).getPropertyValue("--" + k).trim() || "#888";
const DZIS = iso(new Date());
let kat = (location.hash.slice(1) || "wszystko"), mies = new Date(new Date().getFullYear(), new Date().getMonth(), 1), wyb = DZIS, Z = [];
if(!KAT.some(k => k[0] === kat)) kat = "wszystko";

function chips(){
  $("kat").replaceChildren(...KAT.map(([k, n, c]) => el("button", {type:"button", "aria-pressed":String(k === kat),
    onclick:() => { kat = k; history.replaceState(null, "", "#" + k); wczytaj(); }}, c ? el("span", {class:"kropka", style:`background:var(${c})`}) : null, n)));
  $("podtytul").textContent = OPIS[kat];
  document.title = kat === "wszystko" ? "Kalendarz" : "Kalendarz: " + KAT.find(k => k[0] === kat)[1].replace(/^\S+\s/, "");
}
function zakres(){
  const p = new Date(mies); p.setDate(1 - (p.getDay() + 6) % 7);
  const k = new Date(mies.getFullYear(), mies.getMonth() + 1, 0); k.setDate(k.getDate() + (7 - (k.getDay() + 6) % 7) % 7);
  return [p, k];
}
async function wczytaj(){
  chips();
  const [p, k] = zakres();
  $("miesiac").textContent = `${MIES[mies.getMonth()]} ${mies.getFullYear()}`;
  try{
    const r = await fetch(`/api/kalendarz?od=${iso(p)}&do=${iso(k)}&kat=${kat}`, {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    Z = (await r.json()).zdarzenia;
  }catch(e){ Z = []; $("agenda").replaceChildren(el("p", {class:"muted", text:"Nie udało się wczytać kalendarza (" + e.message + ")."})); }
  rysuj();
}
function rysuj(){
  const [p, k] = zakres(), dni = {};
  Z.forEach(z => (dni[z.data] = dni[z.data] || []).push(z));
  $("naglowki").replaceChildren(...DNI.map(d => el("div", {class:"dn", text:d})));
  const kom = [];
  for(const d = new Date(p); d <= k; d.setDate(d.getDate() + 1)){
    const di = iso(d), l = dni[di] || [];
    const pokaz = l.slice(0, 3);
    kom.push(el("button", {type:"button", class:"dzien" + (d.getMonth() !== mies.getMonth() ? " inny" : "") + (di === DZIS ? " dzis" : "") + (di === wyb ? " wyb" : ""),
      "aria-label":`${d.getDate()} ${MIES[d.getMonth()]}, ${l.length} wpisów`, onclick:() => { wyb = di; rysuj(); }},
      el("span", {class:"nr", text:d.getDate()}),
      ...pokaz.map(z => el("span", {class:"ev", style:`background:${kolor(z.kat)}`, text:(z.od ? z.od + " " : "") + z.tytul})),
      l.length > 3 ? el("span", {class:"wiecej", text:`+${l.length - 3}`}) : null,
      el("span", {class:"kropki"}, ...[...new Set(l.map(z => z.kat))].map(c => el("span", {class:"kropka", style:`background:${kolor(c)}`})))));
  }
  $("siatka").replaceChildren(...kom);
  // lista: wybrany dzień i 6 kolejnych (żeby było widać, co dalej)
  const out = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(wyb + "T00:00"); d.setDate(d.getDate() + i);
    const di = iso(d), l = (dni[di] || []);
    if(!l.length && i) continue;
    out.push(el("h3", {text:`${di === DZIS ? "Dziś, " : ""}${DNI_P[(d.getDay() + 6) % 7]} ${d.getDate()} ${MIES_D[d.getMonth()]}`}));
    if(!l.length) out.push(el("p", {class:"muted", text:"Nic zaplanowanego."}));
    l.forEach(z => out.push(el("div", {class:"zd" + (z.zrobione ? " zrobione" : ""), style:`border-left-color:${kolor(z.kat)}`},
      el("div", {class:"g", text:z.od ? z.od + (z.do ? "–" + z.do : "") : "cały dzień"}),
      el("div", {}, el("div", {class:"t", text:z.tytul}), z.opis ? el("div", {class:"o", text:z.opis.length > 220 ? z.opis.slice(0, 220) + "…" : z.opis}) : null,
        z.link ? el("a", {href:z.link, text:"Otwórz →"}) : null))));
  }
  $("agenda").replaceChildren(...out);
}
$("wstecz").onclick = () => { mies = new Date(mies.getFullYear(), mies.getMonth() - 1, 1); wczytaj(); };
$("dalej").onclick = () => { mies = new Date(mies.getFullYear(), mies.getMonth() + 1, 1); wczytaj(); };
$("dzisBtn").onclick = () => { mies = new Date(new Date().getFullYear(), new Date().getMonth(), 1); wyb = DZIS; wczytaj(); };
addEventListener("hashchange", () => { kat = location.hash.slice(1) || "wszystko"; wczytaj(); });
wczytaj();
</script>
<script src="/strony/wspolne/ustawienia.js" defer></script>
</body>
</html>
