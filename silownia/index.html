<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siłownia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Siłownia: raporty ze zrobionych treningów siłowych (z Garmina) do wklejenia w RestOrTrain i plany do zrobienia.
   Dane: GET /api/garmin/silownia (pliki usługi ~/restortrain-garmin/data/raporty i data/plany). */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16202C; --muted:#56606E; --line:#D5DBE3; --soft:#E4E9F0;
  --nav:#1F3A5F; --navInk:#FFFFFF; --sel:#1d63c4; --ok:#1f8a4c; --warn:#a86b00; --bad:#c03442;
  --serif:"Alegreya",Georgia,serif; --sans:"Alegreya Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
    --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
  --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
h1,h2{font-family:var(--serif);line-height:1.15;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--nav);color:var(--navInk);padding:14px 0 18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header.top .back{display:inline-block;font-size:14px;opacity:.75;text-decoration:none;color:inherit;margin-bottom:8px}
header.top h1{font-size:clamp(30px,7vw,42px);font-weight:800}
header.top p{margin:4px 0 0;opacity:.8;font-size:15px}
main{padding:18px 0 60px}
.zakladki{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.zakladki button,.btn{font:inherit;font-size:16px;font-weight:700;padding:9px 16px;border-radius:99px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer}
.zakladki button[aria-selected="true"]{background:var(--sel);border-color:var(--sel);color:#fff}
label.wybor{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
select{font:inherit;font-size:17px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);margin-bottom:14px}
.karta{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.karta h2{font-size:22px}
.karta .pod{color:var(--muted);font-size:14px;margin:2px 0 10px}
pre{font-family:var(--sans);font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--soft);
  border-radius:10px;padding:12px;margin:0 0 12px;user-select:all;-webkit-user-select:all}
.btn.glowny{background:var(--sel);border-color:var(--sel);color:#fff}
.puste{color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="/strony/automatyczne/">← Automatyczne</a>
  <h1>🏋 Siłownia</h1>
  <p>Co zrobiłeś na treningu (z Garmina), gotowe do wklejenia w RestOrTrain.</p>
</div></header>
<main><div class="wrap">
  <div class="zakladki" role="tablist">
    <button type="button" role="tab" id="z-zrobione" aria-selected="true">✅ Zrobione</button>
    <button type="button" role="tab" id="z-plan" aria-selected="false">📋 Do zrobienia</button>
  </div>
  <label class="wybor" for="wybor" id="wybor-et">Trening</label>
  <select id="wybor"></select>
  <div class="puste" id="puste">Wczytuję…</div>
  <div class="karta" id="szczegoly" hidden>
    <h2 id="s-tytul"></h2>
    <div class="pod" id="s-pod"></div>
    <pre id="s-tekst"></pre>
    <button type="button" class="btn glowny" id="kopiuj">📋 Kopiuj do RestOrTrain</button>
  </div>
  <div data-ustawienia="garmin" data-tytul="1"></div>
</div></main>
<script>
const $ = id => document.getElementById(id);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for(const [n, v] of Object.entries(a)){ if(v == null) continue; if(n === "text") e.textContent = v; else if(n === "class") e.className = v; else e.setAttribute(n, v); } e.append(...k.filter(x => x != null)); return e; };
const DNI = ["niedz.", "pon.", "wt.", "śr.", "czw.", "pt.", "sob."];
const data = d => { const x = new Date(d + "T00:00"); return `${DNI[x.getDay()]} ${d.slice(8)}.${d.slice(5, 7)}`; };
let dane = {zrobione: [], do_zrobienia: []}, zakladka = "zrobione";
const biezaca = () => zakladka === "zrobione" ? dane.zrobione : dane.do_zrobienia;

function pokaz(x){
  $("wybor").value = String(x.id);
  $("szczegoly").hidden = false;
  $("s-tytul").textContent = x.tytul;
  $("s-pod").textContent = zakladka === "zrobione"
    ? `${data(x.data)} · ${x.start} · ${x.minuty} min${x.z_planem ? "" : " · bez planu kroków"}`
    : `${data(x.data)} · plan na zegarku`;
  $("s-tekst").textContent = x.tekst;
  $("kopiuj").hidden = zakladka !== "zrobione";
  $("kopiuj").textContent = "📋 Kopiuj do RestOrTrain";
  try{ history.replaceState(null, "", `#${zakladka}-${x.id}`); }catch(e){}
}

function lista(){
  const l = biezaca();
  $("wybor").replaceChildren(...l.map(x => el("option", {value:String(x.id),
    text:`${data(x.data)} · ${x.tytul}${zakladka === "zrobione" ? ` (${x.minuty} min)` : ""}`})));
  $("wybor-et").textContent = zakladka === "zrobione" ? "Zrobiony trening" : "Trening do zrobienia";
  const pusto = !l.length;
  $("wybor").hidden = $("wybor-et").hidden = pusto;
  $("puste").hidden = !pusto;
  $("puste").textContent = zakladka === "zrobione" ? "Brak zrobionych treningów siłowych w Garminie." : "Nic zaplanowanego.";
  if(pusto){ $("szczegoly").hidden = true; return; }
  const zHasha = location.hash.match(/^#(zrobione|plan)-(\d+)$/);
  pokaz((zHasha && zHasha[1] === zakladka && l.find(x => String(x.id) === zHasha[2])) || l[0]);
}
$("wybor").onchange = () => { const x = biezaca().find(y => String(y.id) === $("wybor").value); if(x) pokaz(x); };

function ustawZakladke(z){
  zakladka = z;
  $("z-zrobione").setAttribute("aria-selected", String(z === "zrobione"));
  $("z-plan").setAttribute("aria-selected", String(z === "plan"));
  lista();
}
$("z-zrobione").onclick = () => { history.replaceState(null, "", "#zrobione"); ustawZakladke("zrobione"); };
$("z-plan").onclick = () => { history.replaceState(null, "", "#plan"); ustawZakladke("plan"); };

$("kopiuj").onclick = async () => {
  const t = $("s-tekst").textContent;
  try{ await navigator.clipboard.writeText(t); }
  catch(e){                                   // starsze Safari / brak uprawnień: zaznaczenie i execCommand
    const r = document.createRange(); r.selectNodeContents($("s-tekst"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); }catch(e2){}
  }
  $("kopiuj").textContent = "✅ Skopiowane";
  setTimeout(() => { $("kopiuj").textContent = "📋 Kopiuj do RestOrTrain"; }, 2000);
};

fetch("/api/garmin/silownia", {cache:"no-store"}).then(r => r.json()).then(d => {
  dane = {zrobione: d.zrobione || [], do_zrobienia: d.do_zrobienia || []};
  const z = location.hash.match(/^#(zrobione|plan)/);
  ustawZakladke(z ? z[1] : "zrobione");
}).catch(() => { $("puste").textContent = "Nie udało się wczytać."; });
</script>
<script src="/strony/wspolne/ustawienia.js" defer></script>
</body>
</html>
