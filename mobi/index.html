<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobidziennik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Mobidziennik: wszystko, co bot odczytał (mobi.py -> ~/bot/mobi/stan.json -> /api/mobi). Tylko odczyt. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16202C; --muted:#56606E; --line:#D5DBE3; --soft:#E4E9F0;
  --nav:#1F3A5F; --navInk:#FFFFFF; --sel:#1d63c4; --ok:#1f8a4c; --warn:#a86b00; --bad:#c03442;
  --serif:"Alegreya",Georgia,serif; --sans:"Alegreya Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
    --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1722; --surface:#172231; --ink:#E7ECF2; --muted:#9AA7B6; --line:#2A3A4E; --soft:#1E2B3C;
  --nav:#0B1420; --navInk:#E7ECF2; --sel:#1f6fd6; --ok:#5BBE83; --warn:#E9A23B; --bad:#E06C79; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
h1,h2{font-family:var(--serif);line-height:1.15;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--nav);color:var(--navInk);padding:14px 0 18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
header.top .back{display:inline-block;font-size:14px;opacity:.75;text-decoration:none;color:inherit;margin-bottom:8px}
header.top h1{font-size:clamp(30px,7vw,42px);font-weight:800}
header.top p{margin:4px 0 0;opacity:.8;font-size:15px}
main{padding:18px 0 60px}
.siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.karta,div.karta{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:inherit;text-decoration:none}
a.karta:hover{border-color:var(--sel)}
.karta h2{font-size:23px;display:flex;gap:8px;align-items:center}
.karta .opis{color:var(--muted);font-size:15px;margin:4px 0 10px}
.karta .stan{font-weight:700;font-size:15px}
.karta .stan .uw{color:var(--bad)} .karta .stan .dzis{color:var(--warn)}
.karta.wkrotce{opacity:.65;border-style:dashed}
.znaczek{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:auto;font-family:var(--sans)}
ul{margin:0;padding-left:18px;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:22px;margin-bottom:8px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 160px;min-width:0;height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit}
button{height:44px;border:1.5px solid var(--sel);background:var(--sel);color:#fff;border-radius:10px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}
button.jasny{background:var(--surface);color:inherit;border-color:var(--line)}
pre{white-space:pre-wrap;font-family:var(--sans);font-size:16px;margin:10px 0 0;line-height:1.55}
.muted{color:var(--muted);font-size:14px}
.szybkie{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
.dzien{margin:0 0 14px}
.dzien h3{font-family:var(--serif);font-size:19px;margin:0 0 6px}
.dzien.dzis h3::after{content:" · dziś";color:var(--warn);font-family:var(--sans);font-size:15px}
.lek{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:16px}
.lek .g{color:var(--muted);font-variant-numeric:tabular-nums}
.lek .p{font-weight:700}
.lek .s{color:var(--muted);font-size:14px;font-weight:400}
.lek.odwolana .p{text-decoration:line-through;color:var(--muted)}
.znak{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:1px}
.znak.zd{background:var(--ok);color:#fff}
.lek .zdt{font-size:14px;margin-top:2px}
.znak.odw{background:var(--bad);color:#fff} .znak.zast{background:var(--warn);color:#fff} .znak.spr{background:var(--sel);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px} td,th{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:13px}
.jasny{background:var(--surface);color:inherit;border:1.5px solid var(--line);border-radius:10px;height:40px;padding:0 12px;font:inherit;font-weight:700;cursor:pointer}
.oc{display:inline-block;min-width:1.9em;text-align:center;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin:2px 3px 2px 0}
.oc.nl{opacity:.5;font-weight:400}
.srednia{font-size:17px;margin:0 0 4px}
.oc{font:inherit;font-size:15px;color:inherit;background:transparent;cursor:pointer;height:auto;min-width:2.1em;line-height:1.35;padding:2px 6px;font-weight:700}
.oc.zm{border-color:var(--sel);color:var(--sel)} .oc.dod{border-style:dashed;border-color:var(--sel);color:var(--sel)}
.oc.plus{color:var(--muted);border-style:dashed}
.sym{color:var(--sel)!important} .nw{white-space:nowrap}
.edyt{display:inline-flex;gap:4px;align-items:center;margin:2px 4px 2px 0}
.edyt select{font:inherit;font-size:16px;padding:2px 4px;border-radius:6px;border:1px solid var(--sel);background:var(--surface);color:var(--ink)}
.maly{height:auto;font:inherit;font-size:13px;font-weight:400;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.symbar{font-size:14px;background:var(--soft);border-radius:8px;padding:6px 10px;margin:6px 0 8px} .dobra{color:var(--ok)} .slaba{color:var(--bad)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="back" href="/strony/automatyczne/">← Automatyczne</a>
  <h1>📅 Mobidziennik</h1>
  <p>Plan lekcji z zastępstwami i odwołaniami, sprawdziany i zadania domowe, odczytane z dziennika.</p>
</div></header>
<main><div class="wrap">
  <div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="czas" class="muted">…</span>
    <button type="button" class="jasny" id="odswiez" style="margin-left:auto">↻ Sprawdź teraz</button></div></div>
  <div class="card"><h2>📅 Plan lekcji</h2><div class="tabs" id="tabs"></div><div id="plan"></div></div>
  <div class="card"><h2>📝 Sprawdziany i kartkówki</h2><div id="spr"></div></div>
  <div class="card"><h2>🏠 Zadania domowe</h2><div id="zd"></div></div>
  <div class="card"><h2>🎓 Oceny i średnie</h2><div id="oc"></div></div>
<div data-ustawienia="mobi"></div>
</div></main>
<script>
const $ = id => document.getElementById(id);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for(const [n, v] of Object.entries(a)){ if(v == null) continue; if(n === "text") e.textContent = v; else if(n === "class") e.className = v; else if(n.startsWith("on")) e[n] = v; else e.setAttribute(n, v); } e.append(...k.filter(x => x != null)); return e; };
const DNI = ["poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota", "niedziela"];
const dataPl = iso => { const d = new Date(iso + "T00:00"); return `${DNI[(d.getDay() + 6) % 7]} ${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}`; };
let D = null, TYDZ = 0;
async function wczytaj(){
  D = await (await fetch("/api/mobi", {cache:"no-store"})).json();
  if(!D.skonfigurowany){ $("czas").textContent = "Mobidziennik nie jest jeszcze podłączony."; return; }
  $("czas").textContent = `Ostatni odczyt: ${(D.czas || "").replace("T", " ").slice(0, 16)} (tylko odczyt; częstotliwość w Ustawieniach na dole)`;
  rysuj();
}
function tygodnie(){
  const pon = [...new Set(D.plan.map(x => { const d = new Date(x.data + "T00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.toISOString().slice(0, 10); }))].sort();
  return pon;
}
function rysuj(){
  const dzis = new Date(); const dIso = `${dzis.getFullYear()}-${String(dzis.getMonth() + 1).padStart(2, "0")}-${String(dzis.getDate()).padStart(2, "0")}`;
  const tyg = tygodnie(); if(TYDZ >= tyg.length) TYDZ = 0;
  $("tabs").replaceChildren(...tyg.map((t, i) => el("button", {type:"button", class:"jasny" + (i === TYDZ ? " on" : ""), text:i === 0 ? "Ten tydzień" : i === 1 ? "Następny" : t,
    onclick:() => { TYDZ = i; rysuj(); }})));
  const spr = D.sprawdziany || [];
  const dni = {};
  for(const x of D.plan){
    const d = new Date(x.data + "T00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    if(d.toISOString().slice(0, 10) !== tyg[TYDZ]) continue;
    (dni[x.data] = dni[x.data] || []).push(x);
  }
  $("plan").replaceChildren(...Object.keys(dni).sort().map(data => el("div", {class:"dzien" + (data === dIso ? " dzis" : "")},
    el("h3", {text:dataPl(data)}),
    ...dni[data].map(x => {
      const s = spr.find(y => y.data === data && y.godzina === x.od);
      const zd = (D.zadania || []).filter(y => y.termin === data && (y.godzina ? y.godzina === x.od : y.przedmiot === x.przedmiot));
      return el("div", {class:"lek" + (x.status === "odwołana" ? " odwolana" : "")},
        el("div", {class:"g", text:`${x.od}–${x.do}`}),
        el("div", {}, el("span", {class:"p", text:x.przedmiot}),
          x.status === "odwołana" ? el("span", {class:"znak odw", text:"odwołana"}) : x.status === "zastępstwo" ? el("span", {class:"znak zast", text:"zastępstwo"}) : null,
          s ? el("span", {class:"znak spr", text:s.rodzaj}) : null,
          zd.length ? el("span", {class:"znak zd", text:"zadanie domowe"}) : null,
          el("div", {class:"s", text:[x.zamiast ? "zamiast: " + x.zamiast : "", x.nauczyciel, x.sala ? "sala " + x.sala : "", x.status === "odwołana" && x.info ? x.info : ""].filter(Boolean).join(" · ")}),
          ...zd.map(y => el("div", {class:"zdt", text:`🏠 ${y.tresc}${y.zrobione ? " ✅" : ""}`}))));
    }))));
  if(!Object.keys(dni).length) $("plan").replaceChildren(el("p", {class:"muted", text:"Brak lekcji w tym tygodniu."}));
  $("spr").replaceChildren(spr.length ? el("table", {}, el("tr", {}, ...["Kiedy", "Przedmiot", "Tematyka"].map(t => el("th", {text:t}))),
    ...spr.map(x => el("tr", {}, el("td", {text:`${dataPl(x.data)} ${x.godzina}`}), el("td", {}, el("b", {text:x.przedmiot}), el("div", {class:"muted", text:`${x.rodzaj} · ${x.nauczyciel}`})),
      el("td", {text:x.tematyka})))) : el("p", {class:"muted", text:"Brak zapowiedzi."}));
  const zd = D.zadania || [];
  $("zd").replaceChildren(zd.length ? el("table", {}, el("tr", {}, ...["Termin", "Przedmiot", "Treść"].map(t => el("th", {text:t}))),
    ...zd.map(x => el("tr", {}, el("td", {text:x.termin ? dataPl(x.termin) : "?"}), el("td", {}, el("b", {text:x.przedmiot}), el("div", {class:"muted", text:x.nauczyciel})),
      el("td", {text:x.tresc + (x.zrobione ? " ✅" : "")})))) : el("p", {class:"muted", text:"Brak zadań."}));
  rysujOceny();
}
// ---------- oceny: okresy (I, II, cały rok) i symulacja „co jeśli” (tylko w tej karcie, nic nie idzie do dziennika) ----------
// Średnia zwykła (arytmetyczna) bez wag: oceny „liczone do średniej” z wartością > 0 („+”, „np” nie są liczone).
const WART = {"1":1, "1+":1.5, "2-":1.75, "2":2, "2+":2.5, "3-":2.75, "3":3, "3+":3.5, "4-":3.75, "4":4, "4+":4.5, "5-":4.75, "5":5, "5+":5.5, "6-":5.75, "6":6};
let OKR = null, SYM = {}, EDYT = null;          // SYM[okres][przedmiot] = {zmiany: {id: "4+"|null(usunięta)}, dodane: ["5", …]}
const plOc = x => x == null ? "–" : x.toFixed(2).replace(".", ",");
const kolorOc = x => x == null ? "" : x >= 4.5 ? "dobra" : x >= 3 ? "" : "slaba";
const sr = l => l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length * 100) / 100 : null;
function listaOkresu(){ return OKR === "rok" ? (D.oceny_rok || D.oceny || []) : ((D.oceny_okresy || {})[OKR] || (OKR === (D.okres || "1") ? D.oceny : []) || []); }
function wartosci(p, sym){
  const s = sym && (SYM[OKR] || {})[p.przedmiot] || {zmiany:{}, dodane:[]};
  const w = [];
  for(const o of p.oceny){
    if(o.id in s.zmiany){ if(s.zmiany[o.id]) w.push(WART[s.zmiany[o.id]]); }
    else if(o.liczona) w.push(o.wartosc);
  }
  return w.concat(s.dodane.map(x => WART[x]));
}
function wybor(akt, ok, usun){
  const sel = el("select", {"aria-label":"Ocena na próbę"}, el("option", {value:"", text:"—"}), ...Object.keys(WART).map(k => el("option", {value:k, text:k, ...(k === akt ? {selected:""} : {})})));
  sel.onchange = () => { if(sel.value) ok(sel.value); };
  return el("span", {class:"edyt"}, sel, usun ? el("button", {type:"button", class:"maly", text:"usuń", onclick:usun}) : null,
    el("button", {type:"button", class:"maly", text:"✕", "aria-label":"Zamknij", onclick:() => { EDYT = null; rysujOceny(); }}));
}
function rysujOceny(){
  if(!D.oceny){ $("oc").replaceChildren(el("p", {class:"muted", text:"Oceny pojawią się po najbliższym odczycie."})); return; }
  OKR = OKR || D.okres || "1";
  const lista = listaOkresu().filter(p => p.oceny.length || ((SYM[OKR] || {})[p.przedmiot] || {dodane:[]}).dodane.length);
  const wszystkie = listaOkresu();
  const jestSym = Object.values(SYM[OKR] || {}).some(s => s.dodane.length || Object.keys(s.zmiany).length);
  const srPrzed = sym => sr(wszystkie.map(p => sr(wartosci(p, sym))).filter(x => x != null));
  const srOcen = sym => sr(wszystkie.flatMap(p => wartosci(p, sym)));
  const liczba = (a, b) => [el("b", {class:kolorOc(a), text:plOc(a)}), jestSym && b !== a ? [" → ", el("b", {class:"sym " + kolorOc(b), text:plOc(b)})] : null].flat();
  const tabsOk = el("div", {class:"tabs"}, ...[["1", "I okres"], ["2", "II okres"], ["rok", "Cały rok"]].map(([k, n]) =>
    el("button", {type:"button", class:"jasny" + (k === OKR ? " on" : ""), text:n + (k === (D.okres || "1") ? " (teraz)" : ""), onclick:() => { OKR = k; EDYT = null; rysujOceny(); }})));
  const wiersze = lista.map(p => {
    const s = ((SYM[OKR] = SYM[OKR] || {})[p.przedmiot] = SYM[OKR][p.przedmiot] || {zmiany:{}, dodane:[]});
    const a = sr(wartosci(p, false)), b = sr(wartosci(p, true));
    const chipy = p.oceny.map(o => {
      const k = `${p.przedmiot}|${o.id}`, zm = o.id in s.zmiany;
      if(EDYT === k) return wybor(zm ? s.zmiany[o.id] : o.ocena, v => { s.zmiany[o.id] = v; EDYT = null; rysujOceny(); }, () => { s.zmiany[o.id] = null; EDYT = null; rysujOceny(); });
      const tekst = zm ? (s.zmiany[o.id] ? `${o.ocena}→${s.zmiany[o.id]}` : `${o.ocena}✕`) : o.ocena;
      return el("button", {type:"button", class:"oc" + (o.liczona || zm ? "" : " nl") + (zm ? " zm" : ""), text:tekst,
        title:`${o.kategoria}${o.opis ? ": " + o.opis : ""} · ${o.data} · ${o.nauczyciel}${o.liczona ? "" : " · nie liczona do średniej"}. Dotknij, żeby zmienić na próbę.`,
        onclick:() => { EDYT = k; rysujOceny(); }});
    });
    const dod = s.dodane.map((v, i) => el("button", {type:"button", class:"oc dod", text:v, title:"Ocena dodana na próbę: dotknij, żeby usunąć",
      onclick:() => { s.dodane.splice(i, 1); rysujOceny(); }}));
    const kNowa = `${p.przedmiot}|+`;
    const plus = OKR === "rok" ? null : EDYT === kNowa ? wybor(null, v => { s.dodane.push(v); EDYT = null; rysujOceny(); }, null)
      : el("button", {type:"button", class:"oc plus", text:"＋ ocena", title:"Dodaj ocenę na próbę", "aria-label":`Dodaj ocenę na próbę: ${p.przedmiot}`, onclick:() => { EDYT = kNowa; rysujOceny(); }});
    return el("tr", {}, el("td", {}, el("b", {text:p.przedmiot})), el("td", {}, ...chipy, ...dod, plus), el("td", {class:"nw"}, ...liczba(a, b)));
  });
  $("oc").replaceChildren(tabsOk,
    el("p", {class:"srednia"}, "Średnia ze średnich przedmiotów: ", ...liczba(srPrzed(false), srPrzed(true))),
    el("p", {class:"srednia"}, "Średnia ze wszystkich ocen: ", ...liczba(srOcen(false), srOcen(true)),
      el("span", {class:"muted", text:" (średnie zwykłe, bez wag)"})),
    jestSym ? el("p", {class:"symbar"}, "🧪 Symulacja: niebieskie liczby to średnie z Twoimi zmianami (nic nie trafia do dziennika). ",
      el("button", {type:"button", class:"maly", text:"Wyczyść symulację", onclick:() => { SYM[OKR] = {}; EDYT = null; rysujOceny(); }})) : null,
    lista.length ? el("table", {}, el("tr", {}, ...["Przedmiot", "Oceny", "Średnia"].map(t => el("th", {text:t}))), ...wiersze)
      : el("p", {class:"muted", text:"Brak ocen w tym okresie."}),
    el("p", {class:"muted", style:"font-size:13px;margin-top:6px", text:OKR === "rok" ? "Cały rok: oceny z obu okresów razem. Symulacja działa w zakładkach okresów."
      : "Dotknij ocenę, żeby na próbę ją zmienić albo usunąć; „＋ ocena” dodaje ocenę na próbę. Szare oceny (np. „+”, „np”) nie są liczone do średniej."}));
}
$("odswiez").onclick = async () => {
  $("odswiez").disabled = true; $("czas").textContent = "Sprawdzam w Mobidzienniku… (do minuty)";
  const przed = D && D.czas;
  await fetch("/api/mobi/odswiez", {method:"POST"});
  for(let i = 0; i < 30; i++){ await new Promise(r => setTimeout(r, 3000)); const d = await (await fetch("/api/mobi", {cache:"no-store"})).json(); if(d.czas !== przed){ break; } }
  $("odswiez").disabled = false; wczytaj();
};
wczytaj();
</script>
<script src="/strony/wspolne/ustawienia.js" defer></script>
</body>
</html>
